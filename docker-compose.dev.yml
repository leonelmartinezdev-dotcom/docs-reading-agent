services:
  app:
    build:
      context: .
    container_name: dra_app
    working_dir: /var/www
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - laravel

  vite:
    build:
      context: .
    container_name: dra_vite
    working_dir: /var/www
    command: sh -c "npm install && npm run dev"
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - app
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: dra_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  postgres:
    image: postgres:17
    container_name: dra_postgres
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laravel

  adminer:
    image: adminer:latest
    container_name: dra_adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - laravel

  redis:
    image: redis:8-alpine
    container_name: dra_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel

volumes:
  postgres_data:
  redis_data:
  node_modules:

networks:
  laravel:
    driver: bridge
